<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Powerbank</title>

    <style>
        body {
            background: #0f0f0f;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: flex;
            gap: 40px;
            margin-top: 20px;
        }

        .box {
            flex: 1;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: white;
            box-sizing: border-box;
        }

        .total {
            color: gold;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(45deg, gold, orange);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }

        #qrisBox {
            background: #222;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<h1>Checkout Powerbank</h1>

<form id="checkoutForm">
    <div class="container">

        <!-- KIRI -->
        <div class="box">
            <h3>Identitas Powerbank</h3>

            <label>Nama:</label>
            <input type="text" id="namaBarang" value="Powerbank Fast Charge 20000mAh" readonly>

            <label>Jenis / Seri:</label>
            <input type="text" id="seriBarang" value="PB-X20" readonly>

            <label>Harga:</label>
            <input type="text" id="hargaTampil" readonly>

            <label>Jumlah:</label>
            <input type="number" id="jumlahBarang" value="1" min="1" onchange="hitungTotal()">

            <label>Total:</label>
            <input type="text" id="totalTampil" class="total" readonly>
        </div>

        <!-- KANAN -->
        <div class="box">
            <h3>Data Pembeli</h3>

            <label>No Faktur:</label>
            <input type="text" id="noFaktur" required>

            <label>Tanggal:</label>
            <input type="date" id="tanggal" required>

            <label>Nama Pembeli:</label>
            <input type="text" id="namaPembeli" required>

            <label>Alamat:</label>
            <input type="text" id="alamat" required>

            <label>No KTP:</label>
            <input type="text" id="ktp" required>

            <label>Metode Pembayaran:</label>
            <select id="metode" onchange="showPayment()" required>
                <option value="">-- Pilih --</option>
                <option value="transfer">Transfer Bank</option>
                <option value="ewallet">E-Wallet</option>
                <option value="cod">COD</option>
            </select>

            <div id="transferBox" style="display:none">
                <label>Pilih Bank:</label>
                <select id="bank">
                    <option>BCA</option>
                    <option>BRI</option>
                    <option>BNI</option>
                </select>
            </div>

            <div id="ewalletBox" style="display:none">
                <label>Pilih E-Wallet:</label>
                <select id="wallet">
                    <option>DANA</option>
                    <option>OVO</option>
                    <option>GoPay</option>
                </select>
            </div>

            <div id="qrisBox" style="display:none; text-align:center">
                <h3>Scan QRIS</h3>
                <!-- Ganti log.PNG dengan gambar QRIS di repository Anda -->
                <img src="log.PNG" width="180" alt="QRIS Code">
                <p>Total Bayar:</p>
                <b style="color:gold" id="qrisTotal">Rp 0</b>
                <p>Kode Verifikasi:</p>
                <b style="color:lightgreen" id="tampilKode"></b>
            </div>

            <div id="verifikasiBox" style="display:none">
                <label>Masukkan Kode Verifikasi:</label>
                <input type="text" id="inputKode" onkeyup="cekKode()">
                <p id="statusBayar"></p>
            </div>

            <button type="submit" id="btnSubmit">Proses Pembelian</button>
        </div>

    </div>
</form>

<script>
    // Data Default Barang
    const hargaSatuan = 250000;
    let kodeBenar = Math.floor(100000 + Math.random() * 900000).toString();

    // Inisialisasi awal saat halaman dimuat
    window.onload = function() {
        document.getElementById("tanggal").valueAsDate = new Date();
        document.getElementById("tampilKode").innerText = kodeBenar;
        document.getElementById("noFaktur").value = "INV-" + Math.floor(Math.random() * 899999 + 100000);
        hitungTotal();
    };

    // Fungsi menghitung total secara otomatis
    function hitungTotal() {
        let jumlah = parseInt(document.getElementById("jumlahBarang").value) || 1;
        let total = hargaSatuan * jumlah;

        document.getElementById("hargaTampil").value = "Rp " + hargaSatuan.toLocaleString('id-ID');
        document.getElementById("totalTampil").value = "Rp " + total.toLocaleString('id-ID');
        document.getElementById("qrisTotal").innerText = "Rp " + total.toLocaleString('id-ID');
    }

    // Fungsi menampilkan pilihan pembayaran
    function showPayment() {
        let metode = document.getElementById("metode").value;

        document.getElementById("transferBox").style.display = "none";
        document.getElementById("ewalletBox").style.display = "none";
        document.getElementById("qrisBox").style.display = "none";
        document.getElementById("verifikasiBox").style.display = "none";

        if (metode === "transfer") {
            document.getElementById("transferBox").style.display = "block";
            document.getElementById("btnSubmit").disabled = false;
        } else if (metode === "ewallet") {
            document.getElementById("ewalletBox").style.display = "block";
            document.getElementById("qrisBox").style.display = "block";
            document.getElementById("verifikasiBox").style.display = "block";
            document.getElementById("btnSubmit").disabled = true; // Kunci tombol sampai kode benar
        } else if (metode === "cod") {
            document.getElementById("btnSubmit").disabled = false;
        }
    }

    // Fungsi verifikasi kode QRIS
    function cekKode() {
        let input = document.getElementById("inputKode").value;

        if (input === kodeBenar) {
            document.getElementById("statusBayar").innerHTML = "<span style='color:lightgreen'>Pembayaran berhasil ✔</span>";
            document.getElementById("btnSubmit").disabled = false;
        } else {
            document.getElementById("statusBayar").innerHTML = "<span style='color:red'>Kode salah</span>";
            document.getElementById("btnSubmit").disabled = true;
        }
    }

    // Menggantikan "proses_beli.php" -> Simpan data ke Browser (localStorage) & Buka Struk
    document.getElementById("checkoutForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const dataTransaksi = {
            noFaktur: document.getElementById("noFaktur").value,
            tanggal: document.getElementById("tanggal").value,
            namaPembeli: document.getElementById("namaPembeli").value,
            alamat: document.getElementById("alamat").value,
            ktp: document.getElementById("ktp").value,
            namaBarang: document.getElementById("namaBarang").value,
            seriBarang: document.getElementById("seriBarang").value,
            jumlah: document.getElementById("jumlahBarang").value,
            total: document.getElementById("totalTampil").value,
            metode: document.getElementById("metode").value
        };

        // Simpan transaksi di memori lokal browser
        localStorage.setItem("transaksiTerakhir", JSON.stringify(dataTransaksi));

        // Pindah otomatis ke halaman cetak_struk.html
        window.location.href = "cetak_struk.html";
    });
</script>

</body>
</html>
